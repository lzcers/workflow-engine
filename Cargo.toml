[package]
name = "workflow-engine"
version = "0.1.0"
edition = "2024"
description = "Typed workflow graphs and schedulers with optional PostgreSQL and SQLite backends"
readme = "README.md"
license = "MIT"

[features]
default = []
# 数据库驱动按后端启用；默认构建保持零数据库依赖。
pg = ["dep:sqlx", "dep:chrono", "sqlx/postgres"]
sqlite = ["dep:sqlx", "dep:chrono", "sqlx/sqlite"]

[dependencies]
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
chrono = { version = "0.4.42", default-features = false, features = [
    "clock",
    "serde",
], optional = true }
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio-rustls",
    "derive",
    "chrono",
    "json",
], optional = true }

[dev-dependencies]
chrono = { version = "0.4.42", default-features = false, features = [
    "clock",
    "serde",
] }
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "sqlite",
    "derive",
    "chrono",
    "json",
] }
uuid = { version = "1.18.1", features = ["v4"] }

[[test]]
name = "sqlite_backend"
required-features = ["sqlite"]
