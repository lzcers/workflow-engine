[package]
name = "workflow-engine"
version = "0.1.0"
edition = "2024"
description = "Typed workflow graphs and schedulers with optional PostgreSQL and SQLite backends"
readme = "README.md"
license = "MIT"

[features]
default = []
# 数据库驱动按后端启用；默认构建保持零数据库依赖。
pg = ["dep:sqlx", "sqlx/postgres"]
sqlite = ["dep:sqlx", "dep:form_urlencoded", "sqlx/sqlite"]

[dependencies]
form_urlencoded = { version = "1.2.2", optional = true }
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1.18.1", features = ["v4"] }
chrono = { version = "0.4.42", default-features = false, features = [
    "clock",
    "serde",
] }
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio-rustls",
    "macros",
    "chrono",
    "json",
], optional = true }

[dev-dependencies]
tokio = { version = "1.49.0", features = ["test-util"] }
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "sqlite",
    "macros",
    "chrono",
    "json",
] }

[[test]]
name = "sqlite_backend"
required-features = ["sqlite"]
