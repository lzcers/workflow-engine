[package]
name = "workflow-engine"
version = "0.1.0"
edition = "2024"
description = "Typed workflow engine with PostgreSQL and SQLite backends"
readme = "README.md"
license = "MIT"

[features]
default = ["sqlite"]
# 至少启用一个数据库后端；默认使用 SQLite，也可启用 PostgreSQL 或两者。
pg = ["sqlx/postgres"]
sqlite = ["dep:form_urlencoded", "sqlx/sqlite"]

[dependencies]
form_urlencoded = { version = "1.2.2", optional = true }
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1.18.1", features = ["v4"] }
chrono = { version = "0.4.42", default-features = false, features = [
    "clock",
    "serde",
] }
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio-rustls",
    "macros",
    "chrono",
    "json",
] }

[dev-dependencies]
tokio = { version = "1.49.0", features = ["test-util"] }

[[test]]
name = "sqlite_backend"
required-features = ["sqlite"]
