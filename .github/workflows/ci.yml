name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workflow_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workflow_engine_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WORKFLOW_ENGINE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/workflow_engine_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --all-features --locked
